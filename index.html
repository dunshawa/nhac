
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Music Player</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 10px;
  font-family: Arial, sans-serif;
  color: white;
  background: transparent;
}

.player {
  width: 320px;
  max-width: 100%;
  padding: 16px;
  border: 1px solid #333;
  border-radius: 16px;
  background: #171717;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cover {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: #292929;
  border-radius: 12px;
  font-size: 26px;
}

.info { min-width: 0; }

h3 {
  margin: 0 0 6px;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.info p {
  margin: 4px 0;
  color: #aaa;
  font-size: 12px;
}

#status { color: #65e6a1; }

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin: 18px 0;
}

button {
  border: 0;
  color: white;
  cursor: pointer;
}

.control {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #292929;
  font-size: 16px;
}

.play {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #65e6a1;
  color: #111;
  font-size: 19px;
}

.section-title {
  margin: 18px 0 8px;
  color: #999;
  font-size: 11px;
  letter-spacing: 1px;
}

.song {
  display: flex;
  gap: 10px;
  width: 100%;
  padding: 11px;
  margin: 4px 0;
  text-align: left;
  border-radius: 8px;
  background: transparent;
  font-size: 13px;
}

.song:hover { background: #292929; }

.song.active {
  color: #65e6a1;
  background: #252e29;
}

.song-number { color: #888; }

.song-name {
  flex: 1;
  overflow-wrap: anywhere;
}

audio {
  display: none;
}

.footer {
  margin-top: 14px;
  color: #777;
  font-size: 10px;
  text-align: center;
}
</style>
</head>

<body>
<div class="player">
  <div class="header">
    <div class="cover">♫</div>
    <div class="info">
      <h3 id="title">Chọn bài hát</h3>
      <p id="artist">My Music</p>
      <p id="status">Sẵn sàng</p>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>

  <div class="controls">
    <button class="control" onclick="previousSong()">⏮</button>
    <button class="play" id="playButton"
      onclick="togglePlay()">▶</button>
    <button class="control" onclick="nextSong()">⏭</button>
  </div>

  <div class="section-title">MY PLAYLIST</div>
  <div id="playlist"></div>

  <div class="footer">♪ MINI MUSIC PLAYER</div>
</div>

<script>
/* Thay đường dẫn bằng file MP3 của bạn */
const songs = [
  {
    title: "Năm ấy",
    artist: "DP",
    src: "song1.mp3"
  }
];

let current = 0;

const audio = document.getElementById("audio");
const statusText = document.getElementById("status");
const playButton = document.getElementById("playButton");

function renderPlaylist() {
  const list = document.getElementById("playlist");
  list.innerHTML = "";

  songs.forEach((song, index) => {
    const button = document.createElement("button");
    button.className =
      "song" + (index === current ? " active" : "");

    const number = document.createElement("span");
    number.className = "song-number";
    number.textContent = index + 1;

    const name = document.createElement("span");
    name.className = "song-name";
    name.textContent = song.title;

    button.append(number, name);
    button.onclick = () => playSong(index);
    list.appendChild(button);
  });
}

function playSong(index) {
  current = (index + songs.length) % songs.length;

  audio.src = songs[current].src;
  document.getElementById("title").textContent =
    songs[current].title;
  document.getElementById("artist").textContent =
    songs[current].artist;

  renderPlaylist();

  audio.play().then(() => {
    statusText.textContent = "Đang phát";
  }).catch(() => {
    statusText.textContent =
      "Không tải được MP3. Kiểm tra đường dẫn.";
  });
}

function togglePlay() {
  if (audio.paused) {
    if (!audio.src) {
      playSong(current);
      return;
    }

    audio.play().then(() => {
      statusText.textContent = "Đang phát";
    }).catch(() => {
      statusText.textContent = "Không thể phát bài hát";
    });
  } else {
    audio.pause();
  }
}

function nextSong() {
  playSong(current + 1);
}

function previousSong() {
  playSong(current - 1);
}

audio.addEventListener("play", () => {
  playButton.textContent = "Ⅱ";
});

audio.addEventListener("pause", () => {
  playButton.textContent = "▶";
  if (audio.currentTime > 0)
    statusText.textContent = "Đã tạm dừng";
});

audio.addEventListener("ended", nextSong);

renderPlaylist();
</script>
</body>
</html>
