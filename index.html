
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Widget</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: transparent;
  color: white;
}
.music {
  width: 320px;
  max-width: 100%;
  padding: 18px;
  border-radius: 18px;
  background: #181818;
  border: 1px solid #333;
}
h3 {
  margin: 0 0 6px;
  font-size: 18px;
}
p {
  margin: 0 0 14px;
  color: #aaa;
  font-size: 13px;
}
iframe {
  display: block;
  width: 100%;
  height: 180px;
  border: 0;
  border-radius: 10px;
}
</style>
</head>
<body>
<div class="music">
  <h3>🎧 My Music</h3>
  <p>Now playing · YouTube</p>

  <iframe
    src="https://youtu.be/utike82B1f8"
    title="YouTube Music Player"
    allow="encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>
</body>
</html>
